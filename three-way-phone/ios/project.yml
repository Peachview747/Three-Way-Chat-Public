name: ThreeWayPhone
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ThreeWayPhone:
    type: application
    platform: iOS
    sources:
      - App
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peachview.threeway.phone
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '6'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: AI Room
        CFBundleName: AI Room
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
  ThreeWayPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ThreeWayPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peachview.threeway.phone.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ThreeWayPhone
schemes:
  ThreeWayPhone:
    build:
      targets:
        ThreeWayPhone: all
    test:
      targets:
        - ThreeWayPhoneUITests
