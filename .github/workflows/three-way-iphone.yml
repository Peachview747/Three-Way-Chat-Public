name: AI Room iPhone host build
on:
  push:
    branches: ['codex/three-way-phone-link']
    paths: ['three-way-phone/**', '.github/workflows/three-way-iphone.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: three-way-iphone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test phone conversation storage
        run: |
          swiftc -parse-as-library three-way-phone/ios/App/ConversationStore.swift three-way-phone/tests/StoreTests.swift -o /tmp/three-way-store-tests
          /tmp/three-way-store-tests
      - name: Build and validate sideload IPA
        id: ipa
        run: bash three-way-phone/scripts/build_ipa.sh
      - name: Verify connector in iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone") and x.get("isAvailable")))')
          xcodebuild -project three-way-phone/ios/ThreeWayPhone.xcodeproj -scheme ThreeWayPhone -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath three-way-phone/.build/ConnectorTests.xcresult CODE_SIGNING_ALLOWED=NO test
          xcrun xcresulttool export attachments --path three-way-phone/.build/ConnectorTests.xcresult --output-path three-way-phone/.build/connector-screenshots
      - name: Upload IPA and validation
        if: ${{ !cancelled() && steps.ipa.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: AI-Room-iPhone-0.1.0-Build-8
          path: |
            three-way-phone/.build/AI-Room-0.1.0-Build-8.ipa
            three-way-phone/.build/AI-Room-0.1.0-Build-8.json
            three-way-phone/.build/connector-screenshots
          if-no-files-found: error
          retention-days: 7
