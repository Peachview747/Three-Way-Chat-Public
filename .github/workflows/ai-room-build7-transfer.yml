name: Transfer existing AI Room build 7
on:
  push:
    branches: ['codex/three-way-phone-link']
    paths: ['.github/workflows/ai-room-build7-transfer.yml']
permissions:
  actions: read
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve existing build
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38124283122
          name: AI-Room-iPhone-0.1.0-Build-7
          path: build
      - name: Verify IPA checksum
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('build/AI-Room-0.1.0-Build-7.ipa')
          report=json.loads(p.with_suffix('.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==report['sha256']
          PY
      - name: Stage direct IPA download privately
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create ai-room-build7-transfer build/AI-Room-0.1.0-Build-7.ipa build/AI-Room-0.1.0-Build-7.json --draft --target "$GITHUB_SHA" --title 'Temporary AI Room build 7 transfer' --notes 'Temporary unpublished transfer of a build artifact. Remove after archiving in the private repository.'
